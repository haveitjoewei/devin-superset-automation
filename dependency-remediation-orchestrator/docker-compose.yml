services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: devin
      POSTGRES_PASSWORD: devin
      POSTGRES_DB: devin_jobs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devin -d devin_jobs"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://devin:devin@postgres:5432/devin_jobs
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: python worker.py
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://devin:devin@postgres:5432/devin_jobs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
