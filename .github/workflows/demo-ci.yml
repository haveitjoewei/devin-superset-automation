name: Demo CI Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  demo-ci-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run demo CI test
        run: pytest tests/test_demo_ci.py -v
