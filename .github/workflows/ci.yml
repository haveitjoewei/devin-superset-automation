name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dependency-remediation-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run unit tests
        run: pytest tests -q
      - name: Build image and verify environment files are excluded
        run: |
          printf 'DOCKER_CONTEXT_TEST=not-a-secret\n' > .env
          docker build -t devin-auto-fix:test .
          docker run --rm --entrypoint sh devin-auto-fix:test -c 'test ! -e /app/.env'
